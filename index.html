<script>
  document.getElementById("submitBtn").addEventListener("click", async (e) => {
    e.preventDefault();

    const totalLoss = document.getElementById("totalLoss").value.trim();
    if (!totalLoss) {
      alert("Please enter a value before submitting.");
      return;
    }

    try {
      const response = await fetch("https://script.google.com/macros/s/AKfycbyjljFzvqRDBuexrmtIBopDS4ib1HFOVlzUOrsdTxnv0gPmnGNrC9OXV1LGDx0DCHoz/exec", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ totalLoss }),
      });

      const result = await response.json();

      if (result.ok) {
        alert("Data submitted successfully!");
      } else {
        alert("Error submitting data. Please try again.");
        console.error(result.error);
      }
    } catch (error) {
      alert("Something went wrong. Please check your internet or try again later.");
      console.error(error);
    }
  });
</script>
